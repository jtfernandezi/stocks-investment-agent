name: Weekly Audit

# Headless Claude Code does a full 7-lever audit of the fund and PROPOSES
# improvements as a Pull Request you review/merge from your phone.
# Read-only on production: audit_ro SELECT-only DB role + MCP disabled +
# branch/PR isolation (never pushes to main, never merges). Runs in the cloud
# (Mac off), overnight so it doesn't compete with your daytime token budget.

on:
  schedule:
    # 09:00 UTC Thursday = 03:00 America/Mexico_City (UTC-6, no DST) — opus cap test run
    # to verify opus completes without hitting the session cap. Revert to Sunday after.
    - cron: "0 9 * * 4"
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model (sonnet = reliable on subscription quota; opus = deeper but may hit session limits)"
        default: "opus"
        required: false

permissions:
  contents: write          # push the audit/<date> branch
  pull-requests: write     # open the PR

concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history so the audit can read git log + diff

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Claude Code + audit deps
        run: |
          npm install -g @anthropic-ai/claude-code
          cd automation && npm ci

      - name: Configure git identity
        run: |
          git config user.name  "weekly-audit-bot"
          git config user.email "audit@users.noreply.github.com"

      - name: Run weekly audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUDIT_DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_API_BASE: ${{ secrets.N8N_API_BASE }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_MODEL: ${{ github.event.inputs.model || 'opus' }}
        run: |
          claude -p "$(cat automation/weekly_audit_prompt.md)" \
            --model "$AUDIT_MODEL" \
            --dangerously-skip-permissions \
            --strict-mcp-config \
            --mcp-config automation/empty-mcp.json

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Weekly audit workflow FAILED on $(date -u +%F). Check GitHub Actions logs." >/dev/null
